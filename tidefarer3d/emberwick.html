<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Emberwick — Cel-Shaded 3D Prototype</title>
<style>
  :root{ --ember:#ff9a3c; --parch:#f0e2c0; --walnut2:#33251a; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d1420;
    font-family:Verdana,Geneva,sans-serif;color:var(--parch);
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;}
  body{position:fixed;inset:0;}
  canvas{display:block;position:fixed;inset:0;}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
  #title{position:absolute;left:14px;top:12px;background:rgba(20,14,8,.72);
    border:2px solid var(--walnut2);border-left:4px solid var(--ember);border-radius:8px;
    padding:8px 13px;max-width:min(80vw,360px);box-shadow:0 8px 30px rgba(0,0,0,.55);
    backdrop-filter:blur(3px);}
  #title h1{font-family:Georgia,serif;color:var(--ember);font-size:17px;letter-spacing:1px;
    text-shadow:0 1px 0 #000;}
  #title .sub{font-size:10px;color:var(--parch);opacity:.66;letter-spacing:2px;margin-top:2px;}
  #title .hint{font-size:11px;color:#d8caa2;margin-top:6px;line-height:1.4;}
  #title .keys{font-size:10px;color:#a99873;margin-top:4px;}
  #tag{position:absolute;right:12px;top:12px;font-size:10px;opacity:.5;text-align:right;line-height:1.5;text-shadow:0 1px 2px #000;}
  #fps{position:absolute;right:12px;bottom:10px;font-size:11px;opacity:.5;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000;}
  #zone{position:absolute;left:50%;top:auto;bottom:14%;transform:translateX(-50%);
    font-family:Georgia,serif;color:var(--ember);font-size:14px;letter-spacing:4px;
    opacity:0;transition:opacity .6s;text-shadow:0 2px 8px #000;text-align:center;}
  #zone .z2{display:block;font-size:9px;color:var(--parch);letter-spacing:2px;opacity:.8;margin-top:3px;}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:15;
    background:#0d1420;color:var(--ember);font-family:Georgia,serif;letter-spacing:3px;font-size:13px;transition:opacity .6s;}
  #touch{position:fixed;inset:0;z-index:9;pointer-events:none;display:none;}
  #stick{position:absolute;left:0;bottom:0;width:46vw;height:48vh;pointer-events:auto;}
  #stickBase{position:absolute;width:118px;height:118px;border-radius:50%;
    border:2px solid rgba(240,226,192,.28);background:rgba(20,14,8,.26);transform:translate(-50%,-50%);display:none;}
  #stickKnob{position:absolute;width:54px;height:54px;border-radius:50%;
    border:2px solid rgba(255,154,60,.7);background:rgba(255,154,60,.28);transform:translate(-50%,-50%);display:none;}
  #atk{position:absolute;right:26px;bottom:34px;width:84px;height:84px;border-radius:50%;pointer-events:auto;
    border:2px solid var(--ember);background:rgba(255,154,60,.16);color:var(--ember);
    font-family:Georgia,serif;font-size:13px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;}
  #atk:active{background:rgba(255,154,60,.42);}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:20;font-size:14px;line-height:1.6;}
</style>
</head>
<body>
<div id="load">RAISING THE HOME SHORES…</div>
<div id="hud">
  <div id="title">
    <h1>EMBERWICK ISLE</h1>
    <div class="sub">CEL-SHADED 3D — LOOK TEST</div>
    <div class="hint" id="hint">Loading…</div>
    <div class="keys" id="keys"></div>
  </div>
  <div id="tag">Three.js prototype<br>PC + mobile</div>
  <div id="fps"></div>
  <div id="zone"></div>
</div>
<div id="touch">
  <div id="stick"></div><div id="stickBase"></div><div id="stickKnob"></div>
  <div id="atk">SWING</div>
</div>
<div id="err"><div><b style="color:#ff9a3c">This prototype needs WebGL.</b><br>Try a current Chrome, Safari, Edge or Firefox.</div></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from './vendor/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from './vendor/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './vendor/jsm/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from './vendor/jsm/postprocessing/ShaderPass.js';
import { OutputPass } from './vendor/jsm/postprocessing/OutputPass.js';

/* =====================================================================
   EMBERWICK, cel-shaded, in 3D — take two.
   The goal of this pass is MOOD: warm low-angle sun, soft grounded
   shadows, glowing lamplight and windows, bushy layered trees and a
   muted painterly palette — the feel of Tidefarer's 2D home shores,
   rebuilt with toon materials + bloom + a warm colour grade.
   Everything is generated in code; the only dependency is Three.js
   (vendored locally, no CDN — in keeping with the game's no-asset ethos).
   ===================================================================== */

try { const c=document.createElement('canvas'); if(!(c.getContext('webgl2')||c.getContext('webgl'))) throw 0; }
catch(e){ document.getElementById('err').style.display='flex'; document.getElementById('load').style.display='none'; throw e; }

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0 || matchMedia('(pointer:coarse)').matches;
const isMobile = isTouch || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
const DPR = Math.min(devicePixelRatio, isMobile?1.6:2);

// ---- warm, cohesive palette (pulled toward the 2D game's mood) ----
const COL = {
  grass:0x7b9a4e, grassDk:0x5f8040, grassHi:0x93a95a,
  sand:0xd8c193, sandDk:0xbea877, dirt:0x8a6a45, stonePlaza:0xb6a37e,
  seaDeep:0x235663, sea:0x347585, foam:0xcfe6e0,
  plaster:0xd8b981, plasterDk:0xc0a06a, timber:0x5a3d28, timberDk:0x422b1c,
  slate:0x4c5666, slateDk:0x3a4250, roofWarm:0x9c5638,
  stone:0x9a9384, stoneDk:0x6f6a5f,
  ember:0xff9a3c, flame:0xffbe63, windowGlow:0xffcf87,
  slime:0x86c66a, slimeDk:0x4f9a48,
  wool:0xece3cf, sheepFace:0x4a4038,
  skin:0xe0ac7e, tunic:0x5f7f3f, tunicDk:0x415a2a, scarf:0xff9a3c, boot:0x5a3d24, hair:0x4a3220,
  ink:0x211812,
};
COL.stone = 0x9a9384;

// =====================================================================
//  RENDERER / SCENE / CAMERA / POST
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias:!isMobile, powerPreference:'high-performance' });
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xdfd0ab, 0.0042);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.5, 1200);

// sky dome — warm daylight gradient (haze near the horizon)
const skyTop = new THREE.Color(0x7fb2d6), skyMid = new THREE.Color(0xbcd2d0), skyLow = new THREE.Color(0xf3ddb6);
{
  const g = new THREE.SphereGeometry(700, 32, 20);
  const col=[], p=g.attributes.position, c=new THREE.Color();
  for(let i=0;i<p.count;i++){
    const t=THREE.MathUtils.clamp((p.getY(i)/700)*0.5+0.5,0,1);
    if(t<0.5) c.copy(skyLow).lerp(skyMid, t*2); else c.copy(skyMid).lerp(skyTop,(t-0.5)*2);
    col.push(c.r,c.g,c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.BackSide, fog:false, toneMapped:false})));
}

// ---- lighting: soft golden key + generous sky fill (no blown highlights) ----
// Kept deliberately gentle: a warm low sun for long soft shadows, but strong
// hemispheric fill so shadowed sides read as colour, not black — the calm,
// even key light of a stylised AAA storybook look rather than harsh noon.
const sun = new THREE.DirectionalLight(0xffe1b0, 1.55);
sun.position.set(-58, 46, 46);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile?1024:2048, isMobile?1024:2048);
{ const s=sun.shadow.camera; s.near=10; s.far=260; s.left=-90; s.right=90; s.top=90; s.bottom=-90; }
sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.9; sun.shadow.radius=isMobile?3:9;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcbdcec, 0x6a6038, 1.0));
scene.add(new THREE.AmbientLight(0xfff2dc, 0.18));
const rim = new THREE.DirectionalLight(0xbcd0ff, 0.4); rim.position.set(50,26,-44); scene.add(rim);

// ---- post: bloom + warm vignette grade ----
const fx = new EffectComposer(renderer);
fx.setPixelRatio(DPR);
fx.setSize(innerWidth, innerHeight);
fx.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), isMobile?0.4:0.5, 0.6, 0.78);
fx.addPass(bloom);
fx.addPass(new OutputPass());
const GradeShader = {
  uniforms:{ tDiffuse:{value:null}, uVig:{value:1.5}, uWarm:{value:0.04}, uSat:{value:1.12}, uLift:{value:0.015} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uVig,uWarm,uSat,uLift; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse,vUv).rgb;
      // soft film curve: pull the very brights down a touch, lift shadows slightly
      c = c*(1.0 - 0.10*c);                     // gentle highlight rolloff (tames harsh whites)
      c = mix(vec3(uLift), c, 1.0-uLift);       // faint shadow lift -> less crushed blacks
      // warm tint
      c += vec3(uWarm, uWarm*0.35, -uWarm*0.5);
      // saturation
      float l = dot(c, vec3(0.299,0.587,0.114));
      c = mix(vec3(l), c, uSat);
      // cinematic vignette
      vec2 d = vUv-0.5; float v = smoothstep(0.9,0.22, dot(d,d)*uVig);
      c *= mix(0.72, 1.0, v);
      gl_FragColor = vec4(clamp(c,0.0,1.0),1.0);
    }`
};
fx.addPass(new ShaderPass(GradeShader));

// =====================================================================
//  CEL-SHADE TOOLKIT — banded ramp, inked outline, soft contact shadow
// =====================================================================
const ramp = (()=>{
  const t = new THREE.DataTexture(new Uint8Array([
    64,64,64,255, 128,128,128,255, 200,200,200,255, 255,255,255,255]), 4,1,THREE.RGBAFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter; t.needsUpdate=true; return t;
})();
const outlineMat = new THREE.MeshBasicMaterial({ color:COL.ink, side:THREE.BackSide, fog:true, toneMapped:false });
const OUTLINE_MUL = 1.5;
function toon(geo, color, {outline=0.035, flat=false, emissive=0, emiI=1, cast=true, receive=true}={}){
  const mat = new THREE.MeshToonMaterial({ color, gradientMap:ramp });
  mat.flatShading = flat;
  if(emissive){ mat.emissive=new THREE.Color(emissive); mat.emissiveIntensity=emiI; }
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow=cast; mesh.receiveShadow=receive;
  if(outline>0){ const om=new THREE.Mesh(geo, outlineMat); om.scale.multiplyScalar(1+outline*OUTLINE_MUL); mesh.add(om); }
  return mesh;
}
// bright unlit material (reads as a glow source; bloom picks it up)
function glowMat(color){ return new THREE.MeshBasicMaterial({color, toneMapped:false}); }
const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const cyl=(rt,rb,h,s=10)=>new THREE.CylinderGeometry(rt,rb,h,s);
const ico=(r,d=1)=>new THREE.IcosahedronGeometry(r,d);

// soft round contact-shadow texture (painterly "grounding" blob)
const shadowTex = (()=>{
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const grd=g.createRadialGradient(64,64,4,64,64,62); grd.addColorStop(0,'rgba(20,14,8,0.5)'); grd.addColorStop(1,'rgba(20,14,8,0)');
  g.fillStyle=grd; g.fillRect(0,0,128,128); const t=new THREE.CanvasTexture(c); return t;
})();
const shadowMat = new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, depthWrite:false, fog:true});
function contactShadow(r){ const m=new THREE.Mesh(new THREE.PlaneGeometry(r*2,r*2), shadowMat); m.rotation.x=-Math.PI/2; m.position.y=0.03; m.renderOrder=-1; return m; }

// =====================================================================
//  THE ISLE — textured ground, beach, sea
// =====================================================================
const world = new THREE.Group(); scene.add(world);
const R_LAND = 58;

// procedural grass texture (subtle warm mottling, tileable-ish)
function grassTexture(){
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#6d8f45'; g.fillRect(0,0,256,256);
  for(let i=0;i<1400;i++){
    const x=Math.random()*256,y=Math.random()*256,r=2+Math.random()*10;
    const hue = Math.random(); g.globalAlpha=0.05+Math.random()*0.08;
    g.fillStyle = hue<0.5? '#5f8040' : (hue<0.8?'#93a95a':'#6d8a45');
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  g.globalAlpha=1; const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(9,9); return t;
}
// sea
const waterSeg = isMobile?1:96;
const waterGeo = new THREE.PlaneGeometry(1100,1100, waterSeg, waterSeg); waterGeo.rotateX(-Math.PI/2);
const water = new THREE.Mesh(waterGeo, new THREE.MeshToonMaterial({color:COL.sea, gradientMap:ramp, transparent:true, opacity:0.95}));
// ground convention: grass TOP surface sits at y=0; everything is placed on it.
water.position.y=-0.6; water.receiveShadow=false; world.add(water);
const waterBase = waterGeo.attributes.position.array.slice();
// foam ring
{ const foam=new THREE.Mesh(new THREE.RingGeometry(R_LAND+2, R_LAND+7, 96), new THREE.MeshBasicMaterial({color:COL.foam, transparent:true, opacity:0.5, side:THREE.DoubleSide}));
  foam.rotation.x=-Math.PI/2; foam.position.y=-0.2; world.add(foam); }

// beach + grass discs (tops: grass at 0, beach just below at -0.1)
const beach = toon(cyl(66,69,1.6,64), COL.sand, {outline:0, cast:false}); beach.position.y=-0.9; world.add(beach);
const landMat = new THREE.MeshToonMaterial({color:0xffffff, map:grassTexture(), gradientMap:ramp});
const land = new THREE.Mesh(cyl(R_LAND,64,2.0,64), landMat); land.position.y=-1.0; land.receiveShadow=true; world.add(land);
// low rolling hills for silhouette (hemisphere base sits on the grass top)
[[-20,-30,17,3.4],[30,22,14,2.6],[42,-22,11,2.2],[-34,6,12,2.0]].forEach(([x,z,r,h])=>{
  const hill=new THREE.Mesh(new THREE.SphereGeometry(r,18,12,0,Math.PI*2,0,Math.PI/2), landMat.clone());
  hill.scale.y=h/r; hill.position.set(x,-0.05,z); hill.receiveShadow=true; hill.castShadow=true; world.add(hill);
});

function place(o,x,z,y=0){ o.position.set(x,y,z); world.add(o); return o; }
function ground(g,r){ g.add(contactShadow(r)); return g; }

// ---- stone plaza under the village + dirt paths ----
function plazaTexture(){
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#b6a37e'; g.fillRect(0,0,256,256);
  g.strokeStyle='rgba(70,55,35,0.35)'; g.lineWidth=3;
  for(let i=0;i<=256;i+=32){ g.beginPath();g.moveTo(i,0);g.lineTo(i,256);g.moveTo(0,i);g.lineTo(256,i);g.stroke(); }
  for(let i=0;i<600;i++){ g.globalAlpha=0.06+Math.random()*0.1; g.fillStyle=Math.random()<0.5?'#9c8a66':'#c8b78c';
    g.fillRect(Math.random()*256,Math.random()*256,3+Math.random()*6,3+Math.random()*6); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,4); return t;
}
{ const plaza=new THREE.Mesh(cyl(15,15,0.4,40), new THREE.MeshToonMaterial({color:0xffffff, map:plazaTexture(), gradientMap:ramp}));
  plaza.position.set(0,-0.1,7); plaza.receiveShadow=true; world.add(plaza); }
// dirt path dock -> village (top just above grass)
function path(x0,z0,x1,z1,w){
  const dx=x1-x0, dz=z1-z0, len=Math.hypot(dx,dz);
  const m=new THREE.Mesh(box(len,0.2,w), new THREE.MeshToonMaterial({color:COL.dirt, gradientMap:ramp}));
  m.position.set((x0+x1)/2,-0.08,(z0+z1)/2); m.rotation.y=-Math.atan2(dz,dx); m.receiveShadow=true; world.add(m);
}
path(-50,8,-6,7,4); path(6,7,30,-6,3.4);

// =====================================================================
//  PROPS
// =====================================================================
const foliageGroups=[], sheepList=[], lampFlames=[];

// bushy layered tree
function tree(x,z,s=1){
  const g=new THREE.Group();
  const trunk=toon(cyl(0.32,0.62,3.4,7),COL.timber,{outline:0.04}); trunk.position.y=1.7; g.add(trunk);
  const greens=[0x50783a,0x5e8a42,0x6d9a4d,0x82a857];
  const blobs=[[0,4.3,0,2.6],[1.5,3.9,0.5,1.9],[-1.4,4.1,-0.5,1.85],[0.4,5.5,0.2,1.95],[-0.5,4.0,1.2,1.65],[0.9,4.7,-1.2,1.6]];
  const foli=[];
  blobs.forEach((b,i)=>{ const f=toon(ico(b[3],1),greens[i%greens.length],{outline:0.028}); f.position.set(b[0],b[1],b[2]); f.scale.y=0.92; g.add(f); foli.push(f); });
  // a few warm blossom dots
  for(let i=0;i<5;i++){ const d=new THREE.Mesh(ico(0.22,0), new THREE.MeshToonMaterial({color:0xf0d9a0,gradientMap:ramp}));
    d.position.set((Math.random()-0.5)*4,4+Math.random()*1.6,(Math.random()-0.5)*4); g.add(d); }
  g.userData.foliage=foli; foliageGroups.push(g);
  g.scale.setScalar(s); ground(g,2.4*s); place(g,x,z,0); return g;
}
// berry bush
function bush(x,z){
  const g=new THREE.Group();
  [[0,0.9,0,1.2],[0.9,0.8,0.2,0.9],[-0.7,0.85,0.4,0.85]].forEach(b=>{ const f=toon(ico(b[3],1),0x4f7838,{outline:0.03}); f.position.set(b[0],b[1],b[2]); g.add(f); });
  for(let i=0;i<6;i++){ const d=new THREE.Mesh(ico(0.14,0), new THREE.MeshToonMaterial({color:0xd0473f,gradientMap:ramp})); d.position.set((Math.random()-0.5)*2,0.7+Math.random()*0.8,(Math.random()-0.5)*2); g.add(d); }
  ground(g,1.3); place(g,x,z,0); return g;
}

// cottage — stone base, plaster body, slate hip roof, glowing windows, chimney w/ smoke
function cottage(x,z,rot=0,roof=COL.slate){
  const g=new THREE.Group();
  const base=toon(box(6.8,1.0,5.8),COL.stoneDk,{outline:0.02}); base.position.y=0.5; g.add(base);
  const body=toon(box(6.2,3.6,5.2),COL.plaster,{outline:0.028}); body.position.y=2.7; g.add(body);
  // corner timbers
  for(const sx of [-2.9,2.9]) for(const sz of [-2.5,2.5]){ const t=toon(box(0.45,3.7,0.45),COL.timber,{outline:0}); t.position.set(sx,2.7,sz); g.add(t);}
  const beam=toon(box(6.5,0.4,5.5),COL.timber,{outline:0}); beam.position.y=4.4; g.add(beam);
  // slate hip roof w/ overhang
  const rf=toon(cyl(0.02,5.0,3.0,4),roof,{outline:0.03,flat:true}); rf.position.y=6.1; rf.rotation.y=Math.PI/4; g.add(rf);
  const ridge=toon(box(0.4,0.4,0.4),COL.slateDk,{outline:0}); ridge.position.y=7.6; g.add(ridge);
  // door + glowing windows
  const door=toon(box(1.4,2.4,0.25),COL.timberDk,{outline:0.02}); door.position.set(0,1.7,2.65); g.add(door);
  for(const wx of [-2.0,2.0]){ const w=new THREE.Mesh(box(1.0,1.0,0.15), glowMat(COL.windowGlow)); w.position.set(wx,2.9,2.62); g.add(w);
    const fr=toon(box(1.25,1.25,0.1),COL.timber,{outline:0}); fr.position.set(wx,2.9,2.55); g.add(fr); }
  // chimney + smoke source
  const chim=toon(box(1.0,2.6,1.0),COL.stoneDk,{outline:0.03}); chim.position.set(2.1,6.9,-1.6); g.add(chim);
  g.rotation.y=rot; ground(g,4.2); place(g,x,z,0); return g;
}

// the well
function well(x,z){
  const g=new THREE.Group();
  const base=toon(cyl(1.8,2.0,1.7,16),COL.stone,{outline:0.03}); base.position.y=0.85; g.add(base);
  const w=toon(cyl(1.5,1.5,0.2,16),COL.sea,{outline:0}); w.position.y=1.7; g.add(w);
  for(const sx of [-1.7,1.7]){ const p=toon(box(0.35,3.6,0.35),COL.timber,{outline:0.03}); p.position.set(sx,2.6,0); g.add(p);}
  const roof=toon(cyl(0.02,2.3,1.2,4),COL.roofWarm,{outline:0.03,flat:true}); roof.position.y=4.7; roof.rotation.y=Math.PI/4; g.add(roof);
  const bucket=toon(cyl(0.4,0.35,0.5,10),COL.timber,{outline:0.03}); bucket.position.set(0,2.9,0); g.add(bucket);
  ground(g,2.2); place(g,x,z,0); return g;
}

// Orin's Tower — the beacon
function orinTower(x,z){
  const g=new THREE.Group();
  const shaft=toon(cyl(2.7,3.2,16,14),COL.stone,{outline:0.025}); shaft.position.y=8; g.add(shaft);
  for(const y of [4,9,13]){ const b=toon(cyl(3.15,3.15,0.5,14),COL.stoneDk,{outline:0}); b.position.y=y; g.add(b);}
  const crown=toon(cyl(3.6,3.3,1.5,14),COL.stoneDk,{outline:0.025}); crown.position.y=16.3; g.add(crown);
  const roof=toon(cyl(0.02,4.0,5.0,14),COL.slate,{outline:0.03,flat:true}); roof.position.y=19.3; g.add(roof);
  const win=new THREE.Mesh(box(1.5,2.2,0.4), glowMat(COL.windowGlow)); win.position.set(0,11.5,3.05); g.add(win);
  const light=new THREE.PointLight(0xffcf7a, 40, 46, 2); light.position.set(0,12,3.5); g.add(light);
  g.userData.beacon=win;
  ground(g,3.6); place(g,x,z,0); return g;
}

// iron lamp post with a live flame (the game's signature streetlamp)
function lamp(x,z){
  const g=new THREE.Group();
  const post=toon(cyl(0.12,0.18,4.4,8),COL.timberDk,{outline:0.03}); post.position.y=2.2; g.add(post);
  const arm=toon(box(0.15,0.15,1.0),COL.timberDk,{outline:0}); arm.position.set(0,4.3,0.4); g.add(arm);
  const cage=toon(cyl(0.42,0.42,0.9,6),COL.timber,{outline:0.03}); cage.position.set(0,4.2,0.8); g.add(cage);
  const flame=new THREE.Mesh(ico(0.28,0), glowMat(COL.flame)); flame.position.set(0,4.2,0.8); g.add(flame);
  const light=new THREE.PointLight(0xffb24d, 14, 15, 2); light.position.set(0,4.2,0.8); g.add(light);
  lampFlames.push({flame,light,ph:Math.random()*7});
  ground(g,0.9); place(g,x,z,0); return g;
}

// Willa's fold
function fold(x,z){
  const g=new THREE.Group(); const R=6;
  for(let a=0;a<Math.PI*2-0.35;a+=0.5){ const post=toon(box(0.28,1.5,0.28),COL.timber,{outline:0}); post.position.set(Math.cos(a)*R,0.75,Math.sin(a)*R); g.add(post);
    const rail=toon(box(0.12,0.12,3.0),COL.timber,{outline:0}); rail.position.set(Math.cos(a+0.25)*R,1.1,Math.sin(a+0.25)*R); rail.rotation.y=-a-Math.PI/2; g.add(rail); }
  for(const [sx,sz] of [[-2,1],[2,-1.5],[0.5,2.5]]){
    const s=new THREE.Group();
    const body=toon(ico(1.2,1),COL.wool,{outline:0.04}); body.position.y=1.35; body.scale.set(1.3,1,1.05); s.add(body);
    const head=toon(box(0.65,0.75,0.85),COL.sheepFace,{outline:0.04}); head.position.set(1.35,1.25,0); s.add(head);
    for(const[lx,lz] of [[-0.7,-0.5],[-0.7,0.5],[0.7,-0.5],[0.7,0.5]]){const l=toon(box(0.26,1,0.26),COL.sheepFace,{outline:0});l.position.set(lx,0.5,lz);s.add(l);}
    s.userData.graze=Math.random()*6; ground(s,1.4); s.position.set(sx,0,sz); g.add(s); sheepList.push(s);
  }
  ground(g,6.4); place(g,x,z,0); return g;
}

// Driftwood Dock + moored ferry
function dock(x,z){
  const g=new THREE.Group();
  for(let i=0;i<7;i++){ const pl=toon(box(3.2,0.4,5.0),COL.timber,{outline:0.02,cast:false}); pl.position.set(-i*3.0,0.2,0); g.add(pl);
    if(i%2===0) for(const sz of [-2.2,2.2]){ const post=toon(cyl(0.28,0.28,3,6),COL.timberDk,{outline:0}); post.position.set(-i*3.0,-1.1,sz); g.add(post);} }
  const boat=new THREE.Group();
  const hull=toon(box(7,2,3),COL.timber,{outline:0.03}); hull.position.y=1.0; boat.add(hull);
  const bow=toon(cyl(0.02,1.5,3,3),COL.timber,{outline:0.03}); bow.rotation.z=-Math.PI/2; bow.position.set(4.2,1.0,0); boat.add(bow);
  const trim=toon(box(7.1,0.4,3.1),COL.roofWarm,{outline:0}); trim.position.y=1.9; boat.add(trim);
  const mast=toon(cyl(0.2,0.2,7,6),COL.timberDk,{outline:0.03}); mast.position.set(-0.5,4.4,0); boat.add(mast);
  const sail=toon(box(0.18,4,3.4),0xece0c2,{outline:0.02,cast:false}); sail.position.set(-0.5,4.6,0); boat.add(sail);
  boat.position.set(-20,-0.25,4.6); boat.rotation.y=0.18; boat.userData.bob=Math.random()*6; g.add(boat);
  ground(g,3.0); place(g,x,z,0); g.userData.boat=boat; return g;
}

// scatter: grass tufts + muted flowers (instanced)
function scatter(){
  const bladeGeo=cyl(0.02,0.26,1.0,3); bladeGeo.translate(0,0.5,0);
  const N=isMobile?360:640;
  const inst=new THREE.InstancedMesh(bladeGeo, new THREE.MeshToonMaterial({color:COL.grassDk,gradientMap:ramp}), N);
  inst.castShadow=false; inst.receiveShadow=false; const m=new THREE.Object3D();
  for(let i=0;i<N;i++){ const a=Math.random()*7, r=Math.sqrt(Math.random())*R_LAND*0.95;
    m.position.set(Math.cos(a)*r,1.4,Math.sin(a)*r); m.rotation.y=Math.random()*7; m.scale.set(1,0.6+Math.random()*1.5,1); m.updateMatrix(); inst.setMatrixAt(i,m.matrix); }
  world.add(inst);
  const fGeo=ico(0.26,0);
  [0xd98a6a,0xe8c060,0xf0e6d0,0xb9a0c8].forEach(c=>{ const fi=new THREE.InstancedMesh(fGeo,new THREE.MeshToonMaterial({color:c,gradientMap:ramp}),26);
    for(let i=0;i<26;i++){ const a=Math.random()*7,r=Math.sqrt(Math.random())*R_LAND*0.9;
      m.position.set(Math.cos(a)*r,1.55,Math.sin(a)*r); m.rotation.set(0,Math.random()*7,0); m.scale.setScalar(0.6+Math.random()*0.7); m.updateMatrix(); fi.setMatrixAt(i,m.matrix);} world.add(fi); });
}

// =====================================================================
//  SLIMES
// =====================================================================
const slimes=[];
function makeSlime(x,z){
  const g=new THREE.Group();
  const body=toon(new THREE.SphereGeometry(1.5,20,14),COL.slime,{outline:0.045}); body.position.y=1.4; g.add(body);
  // a glossy highlight
  const hi=new THREE.Mesh(ico(0.5,1), new THREE.MeshBasicMaterial({color:0xdff5cf,transparent:true,opacity:0.35})); hi.position.set(-0.5,2.0,0.6); g.add(hi);
  const eye=new THREE.SphereGeometry(0.2,10,10);
  for(const ex of [-0.5,0.5]){ const e=new THREE.Mesh(eye,new THREE.MeshBasicMaterial({color:0x20301a})); e.position.set(ex,1.7,1.35); g.add(e);}
  ground(g,1.6); place(g,x,z,0);
  const s={g,body,home:new THREE.Vector2(x,z),phase:Math.random()*7,alive:true,pop:0,wander:Math.random()*7};
  slimes.push(s); return s;
}
const bits=[]; const bitGeo=ico(0.28,0); const bitMat=new THREE.MeshToonMaterial({color:COL.slime,gradientMap:ramp});
function burst(x,y,z){ for(let i=0;i<12;i++){ const b=new THREE.Mesh(bitGeo,bitMat); b.position.set(x,y,z);
  b.userData={vx:(Math.random()-0.5)*9,vy:4+Math.random()*6,vz:(Math.random()-0.5)*9,life:0.7}; world.add(b); bits.push(b);} }

// =====================================================================
//  HERO
// =====================================================================
const hero=new THREE.Group(); const rig={};
{
  const torso=toon(box(1.5,1.9,0.9),COL.tunic,{outline:0.04}); torso.position.y=2.4; hero.add(torso);
  const belt=toon(box(1.6,0.4,1.0),COL.boot,{outline:0}); belt.position.y=1.6; hero.add(belt);
  const head=toon(new THREE.SphereGeometry(0.72,16,14),COL.skin,{outline:0.045}); head.position.y=3.85; hero.add(head);
  const hair=toon(new THREE.SphereGeometry(0.78,14,12,0,7,0,Math.PI*0.62),COL.hair,{outline:0.04}); hair.position.y=3.95; hero.add(hair);
  const scarf=toon(cyl(0.55,0.62,0.45,12),COL.scarf,{outline:0.03}); scarf.position.y=3.25; hero.add(scarf);
  const cape=toon(box(1.2,1.6,0.2),COL.scarf,{outline:0.03}); cape.position.set(0,2.5,-0.7); cape.rotation.x=0.25; hero.add(cape);
  rig.arm=new THREE.Group(); const up=toon(box(0.5,1.6,0.5),COL.tunicDk,{outline:0.035}); up.position.y=-0.7; rig.arm.add(up);
  rig.arm.position.set(1.05,3.1,0); hero.add(rig.arm);
  const blade=toon(box(0.16,2.2,0.16),0xd7dbe0,{outline:0.03}); blade.position.y=-1.9; rig.arm.add(blade);
  const hilt=toon(box(0.7,0.24,0.24),COL.ember,{outline:0.03}); hilt.position.y=-0.9; rig.arm.add(hilt);
  const armL=toon(box(0.5,1.6,0.5),COL.tunicDk,{outline:0.035}); armL.position.set(-1.05,2.4,0); hero.add(armL);
  rig.legL=toon(box(0.55,1.7,0.6),COL.boot,{outline:0.035}); rig.legL.position.set(-0.42,0.85,0); hero.add(rig.legL);
  rig.legR=toon(box(0.55,1.7,0.6),COL.boot,{outline:0.035}); rig.legR.position.set(0.42,0.85,0); hero.add(rig.legR);
}
const heroShadow=contactShadow(1.6); hero.add(heroShadow);
hero.position.set(-40,0,10); world.add(hero);
let heroYaw=Math.PI*0.5;

// =====================================================================
//  BUILD EMBERWICK
// =====================================================================
scatter();
cottage(-6,4,0.3, COL.slate);
cottage(8,2,-0.6, COL.roofWarm);
cottage(2,16,Math.PI, COL.slate);
cottage(-12,14,0.5, COL.roofWarm);
well(0,8);
orinTower(4,-34);
dock(-50,8);
fold(18,26);
lamp(-4,1); lamp(6,12); lamp(-13,6); lamp(9,-6); lamp(-30,8);
bush(-16,10); bush(12,18); bush(-2,-6); bush(22,4); bush(-24,0);
for(let i=0;i<15;i++){ const a=-Math.PI*0.75+(Math.random()-0.5)*1.5, r=30+Math.random()*20; tree(Math.cos(a)*r-6, Math.sin(a)*r-6, 0.85+Math.random()*0.6); }
for(let i=0;i<5;i++) tree(24+Math.random()*10, 30+Math.random()*8, 0.9);
for(let i=0;i<6;i++){ const a=Math.random()*7,r=Math.random()*10; makeSlime(34+Math.cos(a)*r,-6+Math.sin(a)*r); }
{ const p=new THREE.Group(); const post=toon(box(0.3,3,0.3),COL.timber,{outline:0.03}); post.position.y=1.5; p.add(post);
  const b=toon(box(3,1.1,0.2),COL.plaster,{outline:0.03}); b.position.y=2.5; p.add(b); ground(p,0.6); place(p,26,-4,0); }

// =====================================================================
//  INPUT
// =====================================================================
const keys={};
addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='Space'){e.preventDefault();doSwing();}
  const n=e.code.match(/^Digit([1-6])$/); if(n) warpTo(+n[1]-1); });
addEventListener('keyup',e=>{ keys[e.code]=false; });
function warpTo(i){ const z=ZONES[i]; if(!z)return; hero.position.set(z.x,0,z.z); heroYaw=Math.atan2(-z.x,-z.z); camYaw=heroYaw+Math.PI; flashZone(z.n,z.s); }

let camYaw=heroYaw+Math.PI, camPitch=0.5, camDist=24;
const look={active:false,id:-1,lx:0,ly:0}, move={active:false,id:-1,ox:0,oy:0,x:0,y:0};
const stickBase=document.getElementById('stickBase'), stickKnob=document.getElementById('stickKnob');
if(isTouch) document.getElementById('touch').style.display='block';
function onDown(e){
  if(e.target.id==='atk'){ doSwing(); return; }
  if(e.pointerType==='mouse'){ look.active=true; look.id=e.pointerId; look.lx=e.clientX; look.ly=e.clientY; return; }
  if(e.clientX<innerWidth*0.5 && !move.active){ move.active=true; move.id=e.pointerId; move.ox=e.clientX; move.oy=e.clientY; move.x=move.y=0;
    stickBase.style.display=stickKnob.style.display='block'; stickBase.style.left=stickKnob.style.left=e.clientX+'px'; stickBase.style.top=stickKnob.style.top=e.clientY+'px';
  } else if(!look.active){ look.active=true; look.id=e.pointerId; look.lx=e.clientX; look.ly=e.clientY; }
}
function onMove(e){
  if(move.active&&e.pointerId===move.id){ let dx=e.clientX-move.ox,dy=e.clientY-move.oy; const mag=Math.hypot(dx,dy),max=52; if(mag>max){dx*=max/mag;dy*=max/mag;}
    move.x=dx/max; move.y=dy/max; stickKnob.style.left=(move.ox+dx)+'px'; stickKnob.style.top=(move.oy+dy)+'px'; }
  if(look.active&&e.pointerId===look.id){ camYaw-=(e.clientX-look.lx)*0.006; camPitch=THREE.MathUtils.clamp(camPitch+(e.clientY-look.ly)*0.005,0.22,1.15); look.lx=e.clientX; look.ly=e.clientY; }
}
function onUp(e){ if(e.pointerId===move.id){move.active=false;move.x=move.y=0;stickBase.style.display=stickKnob.style.display='none';} if(e.pointerId===look.id) look.active=false; }
addEventListener('pointerdown',onDown); addEventListener('pointermove',onMove); addEventListener('pointerup',onUp); addEventListener('pointercancel',onUp);
addEventListener('wheel',e=>{ camDist=THREE.MathUtils.clamp(camDist+e.deltaY*0.02,11,48); },{passive:true});

let swing=0;
function doSwing(){ if(swing>0)return; swing=0.001; const fx=Math.sin(heroYaw),fz=Math.cos(heroYaw);
  for(const s of slimes){ if(!s.alive)continue; const dx=s.g.position.x-hero.position.x,dz=s.g.position.z-hero.position.z,d=Math.hypot(dx,dz);
    if(d>6)continue; if((dx/d)*fx+(dz/d)*fz<0.25)continue; s.alive=false; s.pop=0.001; burst(s.g.position.x,1.6,s.g.position.z); flashZone('SLIME SQUASHED','the meadow menace, thinned'); } }

const zoneEl=document.getElementById('zone'); let zoneT=0;
function flashZone(a,b){ zoneEl.innerHTML=a+'<span class="z2">'+b+'</span>'; zoneEl.style.opacity='1'; zoneT=2.6; }
const ZONES=[
  {n:'EMBERWICK VILLAGE',s:'home shores',x:0,z:8,r:16},
  {n:"ORIN'S TOWER",s:'the sage of the isle',x:4,z:-30,r:12},
  {n:'DRIFTWOOD DOCK',s:'the ferry home',x:-46,z:8,r:14},
  {n:'SLIME MEADOW',s:"Willa's pests",x:34,z:-6,r:14},
  {n:'WHISPERWOOD',s:'the old trees',x:-28,z:-26,r:16},
  {n:"WILLA'S FOLD",s:'mind the flock',x:18,z:26,r:9},
];
let lastZone='';
function checkZone(){ for(const z of ZONES){ if(Math.hypot(hero.position.x-z.x,hero.position.z-z.z)<z.r){ if(z.n!==lastZone){lastZone=z.n;flashZone(z.n,z.s);} return; } } lastZone=''; }

// =====================================================================
//  LOOP
// =====================================================================
document.getElementById('hint').innerHTML = isMobile
  ? 'Left thumb = walk • right drag = look • <b style="color:#ff9a3c">SWING</b> to squash slimes'
  : 'WASD / arrows to walk • drag = look • wheel = zoom • <b style="color:#ff9a3c">SPACE</b> to swing';
document.getElementById('keys').textContent = isMobile ? '' : 'Keys 1–6: jump to Village · Tower · Dock · Meadow · Whisperwood · Fold';

const clock=new THREE.Clock(); let fpsT=0,fpsN=0; const fpsEl=document.getElementById('fps');
const camPos=new THREE.Vector3(), camAim=new THREE.Vector3();
const loadEl=document.getElementById('load');
setTimeout(()=>{ loadEl.style.opacity='0'; setTimeout(()=>loadEl.style.display='none',600); flashZone('EMBERWICK ISLE','HOME SHORES — CHAPTER I'); }, 300);

function tick(){
  const dt=Math.min(clock.getDelta(),0.05), time=clock.elapsedTime;

  // movement (camera-relative)
  let ix=0,iz=0;
  if(keys['KeyW']||keys['ArrowUp'])iz-=1; if(keys['KeyS']||keys['ArrowDown'])iz+=1;
  if(keys['KeyA']||keys['ArrowLeft'])ix-=1; if(keys['KeyD']||keys['ArrowRight'])ix+=1;
  if(move.active){ ix+=move.x; iz+=move.y; }
  let mag=Math.hypot(ix,iz); if(mag>1){ix/=mag;iz/=mag;mag=1;} const moving=mag>0.06;
  if(moving){ const cos=Math.cos(camYaw),sin=Math.sin(camYaw); const wx=ix*cos-iz*sin, wz=-ix*sin-iz*cos;
    heroYaw=Math.atan2(wx,wz); const spd=15*dt*mag; hero.position.x+=wx*spd; hero.position.z+=wz*spd;
    const r=Math.hypot(hero.position.x,hero.position.z); if(r>R_LAND-2){ hero.position.x*=(R_LAND-2)/r; hero.position.z*=(R_LAND-2)/r; } }
  hero.rotation.y+=(heroYaw-hero.rotation.y)*Math.min(1,dt*12);
  const bob=moving?Math.sin(time*11)*0.5:0; if(rig.legL){rig.legL.rotation.x=bob; rig.legR.rotation.x=-bob;}
  hero.position.y=(moving?Math.abs(Math.sin(time*11))*0.12:0); heroShadow.position.y=0.03-hero.position.y;
  if(swing>0){ swing+=dt*3.5; const a=Math.sin(Math.min(swing,1)*Math.PI); rig.arm.rotation.x=-a*2.6; if(swing>=1){swing=0;rig.arm.rotation.x=0;} }
  else if(rig.arm) rig.arm.rotation.x+=(0-rig.arm.rotation.x)*dt*8;

  // camera follow
  const tx=hero.position.x-Math.sin(camYaw)*Math.cos(camPitch)*camDist;
  const tz=hero.position.z-Math.cos(camYaw)*Math.cos(camPitch)*camDist;
  const ty=hero.position.y+4+Math.sin(camPitch)*camDist;
  camPos.set(tx,ty,tz); camera.position.lerp(camPos,Math.min(1,dt*6));
  camAim.set(hero.position.x,hero.position.y+2.5,hero.position.z); camera.lookAt(camAim);

  // slimes
  for(const s of slimes){ if(s.alive){ s.phase+=dt; s.wander+=dt; const sq=1+Math.sin(s.phase*5)*0.16;
      s.body.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq)); s.g.position.y=Math.max(0,Math.sin(s.phase*5))*0.5;
      s.g.position.x+=Math.cos(s.wander*0.7)*dt*1.2; s.g.position.z+=Math.sin(s.wander*0.5)*dt*1.2;
      const dx=s.g.position.x-s.home.x,dz=s.g.position.z-s.home.y; if(Math.hypot(dx,dz)>9){s.g.position.x-=dx*dt;s.g.position.z-=dz*dt;}
    } else { s.pop+=dt; const k=Math.max(0,1-s.pop*3); s.g.scale.setScalar(k); s.g.position.y=(1-k)*2;
      if(s.pop>4){ s.alive=true;s.pop=0;s.g.scale.setScalar(1); s.g.position.set(s.home.x,0,s.home.y); s.phase=Math.random()*7; } } }

  // pop bits
  for(let i=bits.length-1;i>=0;i--){ const b=bits[i],u=b.userData; u.life-=dt; u.vy-=18*dt;
    b.position.x+=u.vx*dt; b.position.y+=u.vy*dt; b.position.z+=u.vz*dt; b.rotation.x+=dt*6; b.scale.setScalar(Math.max(0.01,u.life*1.4));
    if(u.life<=0||b.position.y<0.4){ world.remove(b); bits.splice(i,1); } }

  // foliage sway, sheep graze, lamp flicker, water
  for(const f of foliageGroups) f.rotation.z=Math.sin(time*1.2+f.position.x)*0.035;
  for(const sh of sheepList) sh.rotation.x=Math.sin(time*1.5+sh.userData.graze)*0.06+0.05;
  for(const lf of lampFlames){ const fl=1+Math.sin(time*11+lf.ph)*0.18+Math.sin(time*23+lf.ph)*0.08; lf.flame.scale.setScalar(fl); lf.light.intensity=13*fl; }
  if(waterSeg>1){ const p=water.geometry.attributes.position; for(let i=0;i<p.count;i++){ const x=waterBase[i*3],z=waterBase[i*3+2];
      p.array[i*3+1]=Math.sin(x*0.05+time*1.1)*0.35+Math.cos(z*0.06+time*0.9)*0.3; } p.needsUpdate=true; if(!isMobile) water.geometry.computeVertexNormals(); }
  else water.position.y=-0.5+Math.sin(time*1.2)*0.08;

  if(zoneT>0){ zoneT-=dt; if(zoneT<=0) zoneEl.style.opacity='0'; }
  checkZone();

  fx.render();
  fpsN++; fpsT+=dt; if(fpsT>=0.5){ fpsEl.textContent=Math.round(fpsN/fpsT)+' fps'; fpsN=0;fpsT=0; }
  requestAnimationFrame(tick);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); fx.setSize(innerWidth,innerHeight); });
requestAnimationFrame(tick);
</script>
